<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>saf</title>
  <meta name="description" content="Minimalist full-text search and direct PDF/ZIP downloader for the As-Safir (1974-2016) newspaper archive." />
  <link rel="preconnect" href="https://archive.assafir.com" crossorigin />
  <link rel="dns-prefetch" href="https://archive.assafir.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="statusbar">
    <div class="statusbar-left">
      <span class="tag-active">saf(1)</span>
      <span class="sep">|</span>
      <span class="status-info">1974–2016 (2,059,377 articles)</span>
    </div>
    <div class="statusbar-right">
      <label for="quickIssueDate">issue:</label>
      <input type="date" id="quickIssueDate" min="1974-03-26" max="2016-12-31" value="1982-06-06" title="Direct issue date" />
      <button type="button" id="quickZipBtn" class="btn" title="Download full daily issue as .zip">[get.zip]</button>
      <button type="button" id="quickPage1Btn" class="btn" title="Download page 01 as .pdf">[p01.pdf]</button>
    </div>
  </header>

  <main class="wrap">
    <section class="prompt-panel" aria-label="Search Archive">
      <form id="searchForm" class="search-form">
        <div class="dmenu-row">
          <span class="prompt-label">query&gt;</span>
          <input
            type="search"
            id="queryInput"
            class="search-input"
            dir="auto"
            placeholder="search text (ar/en) or leave empty for chronological index..."
            autocomplete="off"
            autofocus
          />
          <button type="submit" id="searchBtn" class="btn btn-invert">[exec]</button>
        </div>

        <div class="controls-bar">
          <div class="ctrl">
            <label for="fromDate">from:</label>
            <input type="date" id="fromDate" min="1974-01-01" max="2017-12-31" />
          </div>
          <div class="ctrl">
            <label for="toDate">to:</label>
            <input type="date" id="toDate" min="1974-01-01" max="2017-12-31" />
          </div>
          <div class="ctrl">
            <label for="pageSizeSelect">limit:</label>
            <select id="pageSizeSelect">
              <option value="24" selected>24</option>
              <option value="48">48</option>
              <option value="96">96</option>
            </select>
          </div>
          <div class="ctrl">
            <label for="modeSelect">mode:</label>
            <select id="modeSelect">
              <option value="articles" selected>articles (ocr + scan)</option>
              <option value="manifest">manifest (10k pdfs / 1 req)</option>
            </select>
          </div>
          <div class="ctrl-right">
            <button type="button" id="resetBtn" class="btn">[reset]</button>
            <button type="button" id="exportUrlsBtn" class="btn">[export-urls]</button>
          </div>
        </div>

        <div class="presets-bar" aria-label="Quick search presets">
          <span class="preset-label">presets:</span>
          <button type="button" class="chip" data-query="بيروت" data-from="1982-06-01" data-to="1982-09-30">[بيروت 1982]</button>
          <button type="button" class="chip" data-query="فيروز" data-from="" data-to="">[فيروز]</button>
          <button type="button" class="chip" data-query="غسان كنفاني" data-from="" data-to="">[غسان كنفاني]</button>
          <button type="button" class="chip" data-query="الحرب الأهلية" data-from="1975-04-01" data-to="1976-12-31">[1975-1976]</button>
          <button type="button" class="chip" data-query="ناجي العلي" data-from="" data-to="">[ناجي العلي]</button>
          <button type="button" class="chip" data-query="" data-from="1974-03-26" data-to="1974-04-30">[1974-init]</button>
        </div>
      </form>
    </section>

    <section class="infobar" aria-live="polite">
      <div class="infobar-left">
        <span id="statusText">initializing...</span>
        <span id="latencyBadge" class="badge" hidden>0ms</span>
      </div>
      <div class="infobar-right" id="paginationTop">
        <button type="button" id="prevPageBtn" class="btn" disabled>[&lt; prev]</button>
        <span id="pageIndicator" class="page-indicator">1/1</span>
        <button type="button" id="nextPageBtn" class="btn" disabled>[next &gt;]</button>
      </div>
    </section>

    <section id="resultsContainer" class="results-list" aria-label="Search Results"></section>

    <div class="bottom-bar" id="paginationBottom" hidden>
      <button type="button" id="prevPageBottomBtn" class="btn">[&lt; prev]</button>
      <span id="pageIndicatorBottom" class="page-indicator">1/1</span>
      <button type="button" id="nextPageBottomBtn" class="btn">[next &gt;]</button>
    </div>
  </main>

  <!-- Article & Page Scan Preview Modal Dialog -->
  <dialog id="previewDialog" closedby="any" aria-labelledby="dialogTitle">
    <div class="dialog-inner">
      <header class="dialog-header">
        <div class="dialog-title-wrap">
          <h2 id="dialogTitle" class="dialog-title" dir="auto">article</h2>
          <p id="dialogMeta" class="dialog-meta"></p>
        </div>
        <div class="dialog-actions">
          <a id="dialogDownloadPdf" href="#" class="btn btn-invert" target="_blank" rel="noopener">[page.pdf]</a>
          <a id="dialogDownloadZip" href="#" class="btn" target="_blank" rel="noopener">[issue.zip]</a>
          <button type="button" id="closeDialogBtn" class="btn" aria-label="Close modal">[x]</button>
        </div>
      </header>
      <div class="dialog-body">
        <div class="dialog-article-pane">
          <div id="dialogEntities" class="entity-tags"></div>
          <article id="dialogContent" class="article-content" dir="auto"></article>
        </div>
        <div class="dialog-image-pane">
          <div class="scan-toolbar">
            <span>scan preview (grayscale)</span>
            <a id="dialogOpenImage" href="#" target="_blank" rel="noopener" class="scan-link">[raw.jpg]</a>
          </div>
          <div class="scan-frame">
            <img id="dialogScanImg" alt="Scanned newspaper page" loading="lazy" />
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Export URLs Modal Dialog -->
  <dialog id="exportDialog" closedby="any" aria-labelledby="exportDialogTitle">
    <div class="dialog-inner export-dialog-inner">
      <header class="dialog-header">
        <div>
          <h2 id="exportDialogTitle" class="dialog-title">stdout // bulk urls</h2>
          <p class="dialog-meta">direct endpoints for curl(1), aria2c(1), or wget(1)</p>
        </div>
        <button type="button" id="closeExportBtn" class="btn" aria-label="Close export modal">[x]</button>
      </header>
      <div class="export-body">
        <div class="export-controls">
          <label>
            <input type="radio" name="exportType" value="pdf" checked />
            page pdfs (/raw/YYYYMMDDPP.pdf)
          </label>
          <label>
            <input type="radio" name="exportType" value="zip" />
            daily issue zips (/raw-zip/YYYYMMDD01.pdf)
          </label>
          <button type="button" id="copyExportBtn" class="btn btn-invert">[yank]</button>
        </div>
        <textarea id="exportTextarea" class="export-textarea" readonly rows="12"></textarea>
        <div class="cli-hint">
          <span>$ xargs -n 1 -P 4 curl -LOJ &lt; urls.txt</span>
        </div>
      </div>
    </div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
